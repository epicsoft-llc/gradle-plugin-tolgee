stages:
  - build
  - publish
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

#### Disable CI for MR
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always

before_script:
  - chmod +x ./gradlew

#### No cache on purpose: the pipeline runs rarely, and every dependency change would create a new archive.

BLD:plugin:
  stage: build
  image: epicsoft/openjdk:jdk25
  script:
    - ./gradlew build
  artifacts:
    name: "tolgee-plugin-${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    #### always: the test report is most useful when the build failed
    when: always
    paths:
      - build/libs/*.jar
    reports:
      junit: build/test-results/test/TEST-*.xml
    expire_in: 1 week
  retry: 1

#### Publishing authenticates with CI_JOB_TOKEN, which GitLab injects.
#### Tag format: X.Y.Z (no leading "v") — the tag is the artifact version.
#### The rule matches that shape only, so a non-release tag publishes nothing.
PUB:plugin:
  stage: publish
  image: epicsoft/openjdk:jdk25
  needs:
    - job: "BLD:plugin"
      artifacts: true
  script:
    - ./gradlew publish -Pversion=${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/'

#### The code reaches GitHub through the GitLab push mirror, so this job waits for the tag there.
#### GITHUB_TOKEN: fine-grained token with Contents read and write, a protected variable - the tag must be protected too.
REL:github:
  stage: release
  image: epicsoft/ci:latest
  needs:
    - job: "BLD:plugin"
      artifacts: true
    - job: "PUB:plugin"
  variables:
    GITHUB_REPO: "epicsoft-llc/${CI_PROJECT_NAME}"
  script:
    - |
      api="https://api.github.com/repos/${GITHUB_REPO}"
      auth="Authorization: Bearer ${GITHUB_TOKEN}"
      notes=$(awk -v head="## [${CI_COMMIT_TAG}]" 'index($0, head) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md)
      if [ -z "$notes" ]; then
        echo "CHANGELOG.md has no entry for ${CI_COMMIT_TAG}"
        exit 1
      fi
      if curl -sf -H "$auth" "$api/releases/tags/${CI_COMMIT_TAG}" > /dev/null; then
        echo "Release ${CI_COMMIT_TAG} already exists on GitHub"
        exit 0
      fi
      tries=0
      until curl -sf -H "$auth" "$api/git/ref/tags/${CI_COMMIT_TAG}" > /dev/null; do
        tries=$((tries + 1))
        if [ "$tries" -ge 60 ]; then
          echo "Tag ${CI_COMMIT_TAG} did not reach GitHub within 10 minutes - check the push mirror"
          exit 1
        fi
        sleep 10
      done
      id=$(jq -n --arg tag "${CI_COMMIT_TAG}" --arg body "$notes" '{tag_name: $tag, name: $tag, body: $body}' \
        | curl -sS --fail-with-body -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d @- \
        | jq -r .id)
      for jar in build/libs/*.jar; do
        curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/java-archive" --data-binary "@${jar}" \
          "https://uploads.github.com/repos/${GITHUB_REPO}/releases/${id}/assets?name=$(basename "$jar")" > /dev/null
        echo "Attached $(basename "$jar")"
      done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/'
