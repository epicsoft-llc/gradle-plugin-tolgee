stages:
  - build
  - test
  - publish
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

#### Disable CI for MR
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always

before_script:
  - chmod +x ./gradlew

#### No cache on purpose: the pipeline runs rarely, and every dependency change would create a new archive.

BLD:plugin:
  stage: build
  image: epicsoft/openjdk:jdk25
  script:
    - ./gradlew build runtimeDependencies
  artifacts:
    name: "tolgee-plugin-${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    #### always: the test report is most useful when the build failed
    when: always
    paths:
      - build/libs/*.jar
      - build/runtime-dependencies/
    reports:
      junit: build/test-results/test/TEST-*.xml
    expire_in: 1 week
  retry: 1

#### LIC, SEC and DEP run on main only - pushes and the schedule "weekly"; a tag publishes without them.
LIC:plugin:
  stage: test
  image: epicsoft/openjdk:jdk25
  needs:
    - job: "BLD:plugin"
      artifacts: false
  script:
    - ./gradlew checkLicense
  artifacts:
    when: always
    paths:
      - build/reports/dependency-license/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

#### The NVD data come from a central database of the maintainers; nothing about it is written here, and without the
#### ESN_DEPCHECK_* variables (protected) the job does not run. Only the runners tagged epicsoft reach the database.
SEC:plugin:
  stage: test
  tags: [ "epicsoft" ]
  image:
    name: owasp/dependency-check:latest
    entrypoint: [""]
  needs:
    - job: "BLD:plugin"
      artifacts: true
  before_script: [ ]
  script:
    - |
      #### A properties file keeps the credentials out of the process list; '\' is its escape character
      props=$(mktemp)
      printf 'data.connection_string=jdbc:mysql://%s:3306/dependencycheck\ndata.user=%s\ndata.password=%s\n' \
        "${ESN_DEPCHECK_HOSTNAME}" \
        "$(printf '%s' "${ESN_DEPCHECK_USERNAME}" | sed 's/\\/\\\\/g')" \
        "$(printf '%s' "${ESN_DEPCHECK_PASSWORD}" | sed 's/\\/\\\\/g')" > "$props"
      mkdir -p dependency-check
      status=0
      /usr/share/dependency-check/bin/dependency-check.sh \
        --propertyfile "$props" \
        --dbDriverName com.mysql.cj.jdbc.Driver \
        --noupdate \
        --disableVersionCheck \
        --disableCentral \
        --disableOssIndex \
        --project "${CI_PROJECT_NAME}" \
        --scan build/runtime-dependencies \
        --failOnCVSS 5 \
        --format HTML \
        --format JSON \
        --out dependency-check || status=$?
      rm -f "$props"
      exit "$status"
  artifacts:
    when: always
    paths:
      - dependency-check/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $ESN_DEPCHECK_HOSTNAME && $ESN_DEPCHECK_USERNAME && $ESN_DEPCHECK_PASSWORD

#### The newest published depcheck plugin checks the build; an available update is a warning, not a red pipeline.
DEP:plugin:
  stage: test
  image: epicsoft/openjdk:jdk25
  needs:
    - job: "BLD:plugin"
      artifacts: false
  script:
    - ./gradlew --init-script ci/dependency-updates.init.gradle checkDependencyUpdates --no-configuration-cache
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

#### Every task the pipeline uses, with deprecated Gradle features as errors - a warning before the next Gradle major breaks them.
UPG:gradle:
  stage: test
  image: epicsoft/openjdk:jdk25
  needs:
    - job: "BLD:plugin"
      artifacts: false
  script:
    - ./gradlew build runtimeDependencies checkLicense publishToMavenLocal --warning-mode=fail
  artifacts:
    when: always
    paths:
      - build/reports/problems/
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

#### Publishing authenticates with CI_JOB_TOKEN, which GitLab injects.
#### Tag format: X.Y.Z (no leading "v") — the tag is the artifact version.
#### The rule matches that shape only, so a non-release tag publishes nothing.
PUB:plugin:
  stage: publish
  image: epicsoft/openjdk:jdk25
  needs:
    - job: "BLD:plugin"
      artifacts: true
  script:
    - ./gradlew publish -Pversion=${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/'

#### GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET: Plugin Portal API key, masked and protected - plugin-publish reads them itself.
PUB:portal:
  stage: publish
  image: epicsoft/openjdk:jdk25
  needs:
    - job: "BLD:plugin"
      artifacts: false
  script:
    - ./gradlew publishPlugins -Pversion=${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/'

#### The code reaches GitHub through the GitLab push mirror, so this job waits for the tag there.
#### GITHUB_TOKEN: fine-grained token with Contents read and write, a protected variable - the tag must be protected too.
REL:github:
  stage: release
  image: epicsoft/ci:latest
  needs:
    - job: "BLD:plugin"
      artifacts: true
    - job: "PUB:plugin"
  variables:
    GITHUB_REPO: "epicsoft-llc/${CI_PROJECT_NAME}"
  script:
    - |
      api="https://api.github.com/repos/${GITHUB_REPO}"
      auth="Authorization: Bearer ${GITHUB_TOKEN}"
      notes=$(awk -v head="## [${CI_COMMIT_TAG}]" 'index($0, head) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md)
      if [ -z "$notes" ]; then
        echo "CHANGELOG.md has no entry for ${CI_COMMIT_TAG}"
        exit 1
      fi
      if curl -sf -H "$auth" "$api/releases/tags/${CI_COMMIT_TAG}" > /dev/null; then
        echo "Release ${CI_COMMIT_TAG} already exists on GitHub"
        exit 0
      fi
      tries=0
      until curl -sf -H "$auth" "$api/git/ref/tags/${CI_COMMIT_TAG}" > /dev/null; do
        tries=$((tries + 1))
        if [ "$tries" -ge 60 ]; then
          echo "Tag ${CI_COMMIT_TAG} did not reach GitHub within 10 minutes - check the push mirror"
          exit 1
        fi
        sleep 10
      done
      id=$(jq -n --arg tag "${CI_COMMIT_TAG}" --arg body "$notes" '{tag_name: $tag, name: $tag, body: $body}' \
        | curl -sS --fail-with-body -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d @- \
        | jq -r .id)
      for jar in build/libs/*.jar; do
        curl -sS --fail-with-body -X POST -H "$auth" -H "Content-Type: application/java-archive" --data-binary "@${jar}" \
          "https://uploads.github.com/repos/${GITHUB_REPO}/releases/${id}/assets?name=$(basename "$jar")" > /dev/null
        echo "Attached $(basename "$jar")"
      done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(?:\.\d+)?$/'
